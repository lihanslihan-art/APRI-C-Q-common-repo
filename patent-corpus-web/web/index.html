<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>专利语料检索 · Patent Corpus Search</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f7f5;
    --surface: #ffffff;
    --surface-2: #f0f0ed;
    --border: #d9d9d4;
    --border-strong: #bcbcb4;
    --text: #1a1a18;
    --text-dim: #63635c;
    --text-faint: #8e8e85;
    --accent: #b40000;
    --accent-soft: #fdecec;
    --mark-bg: #ffe9a8;
    --mark-text: #3d2f00;
    --radius: 6px;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #17171a;
      --surface: #1f1f23;
      --surface-2: #27272c;
      --border: #34343a;
      --border-strong: #4a4a52;
      --text: #e8e8e4;
      --text-dim: #a2a29a;
      --text-faint: #75756d;
      --accent: #ff6b6b;
      --accent-soft: #35201f;
      --mark-bg: #6b5400;
      --mark-text: #ffe9a8;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17171a;
    --surface: #1f1f23;
    --surface-2: #27272c;
    --border: #34343a;
    --border-strong: #4a4a52;
    --text: #e8e8e4;
    --text-dim: #a2a29a;
    --text-faint: #75756d;
    --accent: #ff6b6b;
    --accent-soft: #35201f;
    --mark-bg: #6b5400;
    --mark-text: #ffe9a8;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 var(--sans);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  a { color: var(--accent); }

  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 10px 16px calc(10px) 16px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
  }
  .hrow { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  h1 .en { color: var(--text-faint); font-weight: 400; margin-left: 6px; font-size: 13px; }
  #stats { color: var(--text-dim); font-size: 12px; font-family: var(--mono); margin-left: auto; }
  .ghost {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: var(--radius); padding: 3px 8px; font-size: 12px; cursor: pointer;
    font-family: var(--sans);
  }
  .ghost:hover { border-color: var(--border-strong); color: var(--text); }

  main { max-width: 980px; margin: 0 auto; padding: 16px; }

  form { display: grid; gap: 10px; }
  .qrow { display: flex; gap: 8px; }
  #q {
    flex: 1; min-width: 0; padding: 9px 12px; font-size: 14px; font-family: var(--mono);
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: var(--radius);
  }
  #q:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  button.primary {
    padding: 9px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
  }
  button.primary:hover { filter: brightness(1.08); }

  .modes { display: flex; gap: 4px; flex-wrap: wrap; }
  .modes label {
    font-size: 12px; padding: 4px 10px; border: 1px solid var(--border);
    border-radius: 999px; cursor: pointer; color: var(--text-dim); user-select: none;
    background: var(--surface);
  }
  .modes input { position: absolute; opacity: 0; width: 0; height: 0; }
  .modes label:has(input:checked) {
    background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600;
  }
  .modes .hint { font-family: var(--mono); font-size: 11px; opacity: .75; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  select {
    font: 12px var(--sans); padding: 5px 8px; max-width: 100%;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
  }

  #meta { color: var(--text-dim); font-size: 12px; font-family: var(--mono); margin: 14px 0 8px; min-height: 18px; }
  #meta .match { color: var(--text-faint); }
  #meta.err { color: var(--accent); }

  ol#results { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li.hit {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 12px; cursor: pointer;
  }
  li.hit:hover { border-color: var(--border-strong); }
  .hit-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  .badge {
    font: 600 11px var(--mono); padding: 1px 6px; border-radius: 3px;
    background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border);
    white-space: nowrap;
  }
  .badge.id { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .hit-title { font-weight: 600; font-size: 13px; }
  .hit-sub { color: var(--text-faint); font-size: 11px; font-family: var(--mono); }
  .snip { color: var(--text-dim); font-size: 12.5px; margin-top: 5px; overflow-wrap: anywhere; }
  mark { background: var(--mark-bg); color: var(--mark-text); padding: 0 1px; border-radius: 2px; }

  .pager { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 18px 0 8px; }
  .pager span { font-size: 12px; font-family: var(--mono); color: var(--text-dim); }

  .empty { color: var(--text-faint); text-align: center; padding: 36px 12px; font-size: 13px; }
  .empty code { font-family: var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 3px; }

  /* drawer */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30;
  }
  aside#drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%);
    background: var(--surface); border-left: 1px solid var(--border);
    z-index: 31; display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .dhead { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .dhead h2 { margin: 6px 0 2px; font-size: 14px; line-height: 1.4; }
  .dbody { overflow-y: auto; padding: 14px 16px; flex: 1; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 12px; margin-bottom: 14px; }
  .kv dt { color: var(--text-faint); font-family: var(--mono); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .sect { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em;
          color: var(--text-faint); margin: 16px 0 6px; }
  .toc { font-size: 12px; display: grid; gap: 1px; }
  .toc button {
    text-align: left; background: none; border: none; color: var(--text-dim);
    font: 12px var(--sans); cursor: pointer; padding: 2px 4px; border-radius: 3px;
    display: flex; gap: 8px; justify-content: space-between;
  }
  .toc button:hover { background: var(--surface-2); color: var(--text); }
  .toc .pg { font-family: var(--mono); color: var(--text-faint); flex: none; }
  pre#pagetext {
    white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.6 var(--mono);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px; margin: 0; max-height: none;
  }
  .pagenav { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .pagenav input { width: 72px; font: 12px var(--mono); padding: 4px 6px;
    background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>专利语料检索<span class="en">Patent Corpus Search</span></h1>
    <span id="stats">加载中…</span>
    <button class="ghost" id="theme" title="切换主题">主题</button>
  </div>
</header>

<main>
  <form id="form" autocomplete="off">
    <div class="qrow">
      <input id="q" placeholder="检索 802.11 标准与 Wi-Fi 8 工作组文档，按 / 聚焦" aria-label="查询">
      <button class="primary" type="submit">检索</button>
    </div>
    <div class="modes" id="modes">
      <label><input type="radio" name="mode" value="token" checked>词项 <span class="hint">a b → AND</span></label>
      <label><input type="radio" name="mode" value="phrase">短语 <span class="hint">"精确顺序"</span></label>
      <label><input type="radio" name="mode" value="boolean">布尔 <span class="hint">AND OR NOT ( )</span></label>
      <label><input type="radio" name="mode" value="prefix">前缀 <span class="hint">sensi*</span></label>
    </div>
    <div class="filters" id="filters"></div>
  </form>

  <div id="meta"></div>
  <ol id="results"></ol>
  <div class="pager" id="pager" hidden>
    <button class="ghost" id="prev">← 上一页</button>
    <span id="pginfo"></span>
    <button class="ghost" id="next">下一页 →</button>
  </div>
</main>

<div class="overlay" id="overlay" hidden></div>
<aside id="drawer" hidden aria-label="文档详情">
  <div class="dhead">
    <div class="hrow">
      <span class="badge id" id="d-id"></span>
      <button class="ghost" id="d-close" style="margin-left:auto">关闭 (Esc)</button>
    </div>
    <h2 id="d-title"></h2>
  </div>
  <div class="dbody" id="d-body"></div>
</aside>

<script>
const API = "";
const LIMIT = 20;
const FILTER_DEFS = [
  { key: "corpus", label: "语料" },
  { key: "kind",   label: "类型" },
  { key: "topic",  label: "主题" },
  { key: "ballot", label: "投票轮" },
  { key: "year",   label: "年份" },
];
const state = { offset: 0, total: 0, lastQuery: null };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ---------- theme ---------- */
(function theme() {
  let saved = null;
  try { saved = localStorage.getItem("pcs-theme"); } catch (e) { /* private mode */ }
  if (saved) document.documentElement.dataset.theme = saved;
  $("theme").onclick = () => {
    const cur = document.documentElement.dataset.theme;
    const dark = cur ? cur === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("pcs-theme", next); } catch (e) { /* ignore */ }
  };
})();

/* ---------- boot ---------- */
async function boot() {
  try {
    const s = await (await fetch(API + "/api/stats")).json();
    const mb = (s.db_bytes / 1e6).toFixed(0);
    $("stats").textContent =
      `${s.documents.toLocaleString()} 文档 · ${s.pages.toLocaleString()} 页 · ${mb} MB`;
    $("stats").title = "建库时间 " + (s.built_at || "未知");
  } catch (e) {
    $("stats").textContent = "服务未就绪";
  }
  try {
    const f = await (await fetch(API + "/api/facets")).json();
    const box = $("filters");
    box.innerHTML = "";
    for (const def of FILTER_DEFS) {
      const opts = f[def.key] || [];
      if (!opts.length) continue;
      const sel = document.createElement("select");
      sel.id = "f-" + def.key;
      sel.innerHTML = `<option value="">${esc(def.label)}：全部</option>` +
        opts.map(o => `<option value="${esc(o.value)}">${esc(o.value)} (${o.count})</option>`).join("");
      sel.onchange = () => { state.offset = 0; run(); };
      box.appendChild(sel);
    }
  } catch (e) { /* filters are optional */ }
  const url = new URLSearchParams(location.hash.slice(1));
  if (url.get("q")) { $("q").value = url.get("q"); run(); }
  else $("q").focus();
}

function currentParams() {
  const p = new URLSearchParams();
  p.set("q", $("q").value.trim());
  p.set("mode", document.querySelector('input[name=mode]:checked').value);
  for (const def of FILTER_DEFS) {
    const el = $("f-" + def.key);
    if (el && el.value) p.set(def.key, el.value);
  }
  p.set("limit", LIMIT);
  p.set("offset", state.offset);
  return p;
}

async function run() {
  const q = $("q").value.trim();
  if (!q) { $("meta").textContent = ""; $("results").innerHTML = ""; $("pager").hidden = true; return; }
  const p = currentParams();
  $("meta").className = "";
  $("meta").textContent = "检索中…";
  try {
    const res = await fetch(API + "/api/search?" + p.toString());
    const d = await res.json();
    if (!res.ok) throw new Error(d.detail || res.statusText);
    render(d);
    location.hash = "q=" + encodeURIComponent(q);
  } catch (e) {
    $("meta").className = "err";
    $("meta").textContent = "查询失败：" + e.message;
    $("results").innerHTML = "";
    $("pager").hidden = true;
  }
}

function render(d) {
  state.total = d.total;
  const cap = d.total_capped ? "+" : "";
  $("meta").innerHTML =
    `${d.total.toLocaleString()}${cap} 条命中 · ${d.took_ms} ms` +
    ` <span class="match">MATCH ${esc(d.match)}</span>`;

  const ol = $("results");
  if (!d.results.length) {
    ol.innerHTML = `<div class="empty">没有命中。试试<code>前缀</code>模式，或放宽筛选条件。</div>`;
    $("pager").hidden = true;
    return;
  }
  ol.innerHTML = d.results.map(r => `
    <li class="hit" data-corpus="${esc(r.corpus)}" data-doc="${esc(r.doc_id)}" data-page="${esc(r.page)}">
      <div class="hit-top">
        <span class="badge id">${esc(r.doc_id)}</span>
        ${r.kind ? `<span class="badge">${esc(r.kind)}</span>` : ""}
        ${r.ballot ? `<span class="badge">${esc(r.ballot)}</span>` : ""}
        <span class="badge">p.${esc(r.page)}</span>
        <span class="hit-sub">首次公开 ${esc(r.first_disclosed || "—")}</span>
      </div>
      <div class="hit-title">${esc(r.title || "(无标题)")}</div>
      <div class="snip">${r.snippet_html}</div>
    </li>`).join("");

  for (const li of ol.children) {
    li.onclick = () => openDoc(li.dataset.corpus, li.dataset.doc, li.dataset.page);
  }

  const from = d.offset + 1, to = d.offset + d.results.length;
  $("pginfo").textContent = `${from}–${to} / ${d.total.toLocaleString()}${cap}`;
  $("prev").disabled = d.offset === 0;
  $("next").disabled = to >= d.total;
  $("pager").hidden = false;
}

/* ---------- document drawer ---------- */
let dctx = null;

async function openDoc(corpus, docId, page) {
  $("overlay").hidden = false;
  $("drawer").hidden = false;
  $("d-id").textContent = docId;
  $("d-title").textContent = "加载中…";
  $("d-body").innerHTML = "";
  try {
    const doc = await (await fetch(
      `${API}/api/doc/${encodeURIComponent(docId)}?corpus=${encodeURIComponent(corpus)}`)).json();
    dctx = { corpus, docId, pages: doc.pages_with_text || [] };
    $("d-title").textContent = doc.title || "(无标题)";
    const rows = [
      ["语料", doc.corpus], ["类型", doc.kind], ["投票轮", doc.ballot],
      ["年份", doc.year], ["作者", doc.author], ["首次公开", doc.first_disclosed],
      ["系列", doc.family], ["有文本页数", dctx.pages.length],
    ].filter(([, v]) => v !== null && v !== undefined && v !== "");

    let html = `<dl class="kv">` +
      rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("") +
      (doc.url ? `<dt>原文</dt><dd><a href="${esc(doc.url)}" target="_blank" rel="noopener">Mentor</a></dd>` : "") +
      `</dl>`;

    if (doc.scope) html += `<div class="sect">范围</div><div>${esc(doc.scope)}</div>`;
    if (doc.patent_relevance)
      html += `<div class="sect">专利相关性</div><div>${esc(doc.patent_relevance)}</div>`;
    if (doc.topics && doc.topics.length)
      html += `<div class="sect">主题</div><div class="chips">` +
        doc.topics.map(t => `<span class="badge">${esc(t.topic)}${
          t.score != null ? " " + Number(t.score).toFixed(1) : ""}</span>`).join("") + `</div>`;

    html += `<div class="sect">正文</div>
      <div class="pagenav">
        <button class="ghost" id="pg-prev">←</button>
        <input id="pg-num" type="number" min="1" value="${esc(page)}">
        <button class="ghost" id="pg-next">→</button>
        <span class="hit-sub" id="pg-of"></span>
      </div>
      <pre id="pagetext">加载中…</pre>`;

    if (doc.toc && doc.toc.length) {
      html += `<div class="sect">目录 (${doc.toc.length})</div><div class="toc">` +
        doc.toc.map(t => `<button data-page="${esc(t.page ?? "")}">
            <span style="padding-left:${Math.max(0, (Number(t.level) || 1) - 1) * 12}px">${esc(t.title || "")}</span>
            <span class="pg">${t.page != null ? "p." + esc(t.page) : ""}</span>
          </button>`).join("") + `</div>`;
    }
    $("d-body").innerHTML = html;

    $("pg-prev").onclick = () => stepPage(-1);
    $("pg-next").onclick = () => stepPage(1);
    $("pg-num").onchange = () => loadPage($("pg-num").value);
    for (const b of document.querySelectorAll(".toc button")) {
      b.onclick = () => { if (b.dataset.page) loadPage(b.dataset.page); };
    }
    loadPage(page);
  } catch (e) {
    $("d-title").textContent = "加载失败";
    $("d-body").textContent = String(e.message || e);
  }
}

function stepPage(delta) {
  const pages = dctx.pages;
  const cur = Number($("pg-num").value);
  const i = pages.indexOf(cur);
  const next = i >= 0 ? pages[i + delta] : pages[0];
  if (next != null) loadPage(next);
}

async function loadPage(page) {
  if (!dctx) return;
  $("pg-num").value = page;
  const pages = dctx.pages;
  const i = pages.indexOf(Number(page));
  $("pg-of").textContent = i >= 0 ? `第 ${i + 1} / ${pages.length} 个有文本页` : "";
  $("pagetext").textContent = "加载中…";
  try {
    const r = await fetch(`${API}/api/doc/${encodeURIComponent(dctx.docId)}/page/${
      encodeURIComponent(page)}?corpus=${encodeURIComponent(dctx.corpus)}`);
    const d = await r.json();
    $("pagetext").textContent = r.ok ? d.body : (d.detail || "此页无文本");
  } catch (e) {
    $("pagetext").textContent = "加载失败：" + e.message;
  }
}

function closeDrawer() {
  $("drawer").hidden = true;
  $("overlay").hidden = true;
  dctx = null;
}

/* ---------- wiring ---------- */
$("form").onsubmit = (e) => { e.preventDefault(); state.offset = 0; run(); };
for (const r of document.querySelectorAll('input[name=mode]'))
  r.onchange = () => { state.offset = 0; if ($("q").value.trim()) run(); };
$("prev").onclick = () => { state.offset = Math.max(0, state.offset - LIMIT); run(); };
$("next").onclick = () => { state.offset += LIMIT; run(); };
$("d-close").onclick = closeDrawer;
$("overlay").onclick = closeDrawer;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("drawer").hidden) closeDrawer();
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); $("q").select(); }
});

boot();
</script>
</body>
</html>
